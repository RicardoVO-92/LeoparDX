<div class="fondoLogin">

  <div class="loginCard fontCardTitulos">
    <h1>Login</h1>
  </div>

  <div class="cardCentrada">
    <div class="glassCard">

      <label class="labelUNE" for="email">Usuario</label>
      <input class="inputUNE" type="email" id="email" name="email" placeholder="Email" [(ngModel)]="user.email">

      <label class="labelUNE" for="password">Contraseña</label>
      <input class="inputUNE" type="password" id="password" name="password" placeholder="Contraseña" [(ngModel)]="user.password">
        
        
      <div class="button-group">
        <button class="mainBtnSecondary" type="button" (click)="inicio()">Inicio</button>
        <button class="btnUNE" type="button" (click)="loginGYM()">Entrar</button>
      </div>
    </div>
  </div>

    <div class="glassCard" >
      <a style="text-align: center; color: aliceblue;">¿No tienes usuario?</a>
      <button class="btnUNE1" type="button" (click)="irRegistrar()">Registrate</button>

    </div>

</div>
