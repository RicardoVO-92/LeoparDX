<div class="fondoLogin">

  <div class="loginCard fontCardTitulos">
    <h1>Login</h1>
  </div>

  <div class="cardCentrada">
    <div class="glassCard">

      <label class="labelUNE" for="email">Usuario</label>
      <input class="inputUNE" type="email" id="email" name="email"
             placeholder="Usuario" [(ngModel)]="user.email">

      <label class="labelUNE" for="password">Contraseña</label>
      <input class="inputUNE" type="password" id="password" name="password"
             placeholder="Contraseña" [(ngModel)]="user.password">

      <button class="btnUNE" type="button" (click)="loginGYM()">Entrar</button>

    </div>
  </div>

</div>
